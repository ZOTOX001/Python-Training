{% extends "base.html" %}

{% block content %}
  <h1>My Notes</h1>

  {% if notes %}
    {% for note in notes %}
      <div class="note-card">
        <a href="{% url 'note_detail' note.pk %}">{{ note.title }}</a>
        <small>{{ note.created_at|date:"M d, Y" }}</small>
      </div>
    {% endfor %}
  {% else %}
    <p>No notes yet. <a href="{% url 'note_create' %}">Create one</a>.</p>
  {% endif %}
{% endblock %}
